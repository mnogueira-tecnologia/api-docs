openapi: 3.0.0
info:
  title: APIs ArquivoNfe - Documentação de integração - Teste ao vivo
  version: 1.0.0
  description: |
    API para consulta e validação de dados cadastrais de empresas no Brasil.
    
    Teste a API gratuitamente

    1. Crie sua conta grátis no [Site](https://portal.arquivo-nfe.com)
    2. Copie seu token de acesso no meu lateral "Meu Token"
    3. Volte a está página, clique no botão "Authorize" e informe:
  
       SEU_TOKEN

    **Observação:** Todos os parâmetros informados às APIs devem conter a quantidade completa de dígitos, inclusive zeros à esquerda quando aplicável. Os valores podem ser enviados com ou sem máscara, conforme especificado na documentação de cada API. 
servers:
  - url: https://api.arquivo-nfe.com/prod
tags:
  - name: CNPJ
paths:
  /cnpj_receita:
    post:
      tags:
        - CNPJ
      summary: Consulta CNPJ na Receita Federal
      description: |
         Obtenha dados completos de empresas em segundos.
        
         Fluxo:
            - Sem o envio do parâmetro request_id: inicia o processamento
            - Com o envio do parâmetro request_id: retorna o resultado da consulta


         Teste a API gratuitamente

         1. Crie sua conta grátis no [Site](https://portal.arquivo-nfe.com)
         2. Copie seu token de acesso no meu lateral "Meu Token"
         3. Volte a está página, clique no botão "Authorize" e informe:
  
            SEU_TOKEN
  
         **Observação:** Os parâmetros informados devem conter a quantidade completa de dígitos, inclusive zeros à esquerda quando aplicável. Para os parâmetros que admitirem formatação, os valores podem ser enviados com ou sem máscara. 

      operationId: consultaCNPJ
      parameters:
        - name: cnpj
          in: query
          required: true
          description: CNPJ com ou sem máscara
          schema:
            type: string
            example: "00.000.000/0001-91"
        - name: qsa
          in: query
          required: false
          description: Indica se deve retornar o quadro societário (QSA). 0 = não, 1 = sim
          schema:
            type: integer
            enum: [0, 1]
            example: 0
        - name: request_id
          in: query
          required: false
          description: Identificador da requisição assíncrona retornado na primeira chamada e utilizado para consultar o resultado posteriormente
          schema:
            type: integer
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Exemplo de Retorno da consulta
          content:
            application/json:
              examples:
                processamento:
                  summary: Consulta em processamento
                  value:
                    info: "Aguardando retorno da SEFAZ. Consulte novamente em instantes."
                    request_id: 12345
                sucesso:
                  summary: Sucesso (exemplo real)
                  value:
                    info: "Sucesso"
                    data:
                      numero_inscricao: "00.000.000/0001-91"
                      razao_nome: "BANCO DO BRASIL SA"
                      matriz_filial: "1 - MATRIZ"
                      fantasia: "DIRECAO GERAL"
                      csit_cadastral: "02"
                      xsit_cadastral: "ATIVA"
                      dt_situacao: "2005-11-03"
                      cmotivo_sit: "00"
                      xmotivo_sit: "SEM MOTIVO"
                      cnatur_juridica: "2038"
                      xnatur_juridica: "Sociedade de Economia Mista"
                      dt_ini_ativ: "1966-08-01"
                      ccnae_princ: "6422100"
                      xcnae_princ_desc: "Bancos múltiplos, com carteira comercial"
        '400':
          description: Requisição inválida
        '401':
          description: Não autorizado
        '500':
          description: Erro interno

  /consulta_cadastro:
    post:
      tags:
        - SINTEGRA
      summary: Consulta Cadastro SINTEGRA
      description: |
        Consulta dados cadastrais no SINTEGRA por UF.

        Fluxo:
        - Sem o envio do parâmetro request_id: inicia o processamento
        - Com o envio do parâmetro request_id: retorna o resultado da consulta

        É obrigatório informar pelo menos um dos parâmetros: cnpj, cpf ou ie.

        Teste a API gratuitamente

        1. Crie sua conta grátis no [Site](https://portal.arquivo-nfe.com)
        2. Copie seu token de acesso no meu lateral "Meu Token"
        3. Volte a está página, clique no botão "Authorize" e informe:
      
           SEU_TOKEN
      
        **Observação:** Os parâmetros informados devem conter a quantidade completa de dígitos, inclusive zeros à esquerda quando aplicável. Para os parâmetros que admitirem formatação, os valores podem ser enviados com ou sem máscara. 

      operationId: consultaSintegra
      parameters:
        - name: uf
          in: query
          required: true
          description: Sigla da UF consultada
          schema:
            type: string
            example: "DF"
        - name: cnpj
          in: query
          required: false
          description: CNPJ do contribuinte
          schema:
            type: string
            example: "00.000.000/0001-91"
        - name: cpf
          in: query
          required: false
          description: CPF do contribuinte
          schema:
            type: string
        - name: ie
          in: query
          required: false
          description: Inscrição estadual do contribuinte
          schema:
            type: string
        - name: request_id
          in: query
          required: false
          description: Identificador da requisição assíncrona retornado na primeira chamada e utilizado para consultar o resultado posteriormente
          schema:
            type: integer
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Retorno da consulta SINTEGRA
          content:
            application/json:
              examples:
                processamento:
                  summary: Consulta em processamento
                  value:
                    info: "Aguardando retorno do SINTEGRA. Consulte novamente em instantes."
                    request_id: 67890
                sucesso:
                  summary: Consulta concluída
                  value:
                    info: "Sucesso"
                    data:
                      uf: "DF"
                      cnpj: "00.000.000/0001-91"
                      ie: "123456789"
                      situacao: "HABILITADO"
        '400':
          description: Requisição inválida
        '401':
          description: Não autorizado
        '500':
          description: Erro interno
          
  /cadesp:
    post:
      tags:
        - CADESP
      summary: API Consulta CADESP (SEFAZ-SP)
      description: |
        Consulta Situação Cadastral de Contribuintes ICMS

        Fluxo:
        - Sem o envio do parâmetro request_id: inicia o processamento
        - Com o envio do parâmetro request_id: retorna o resultado da consulta

        Teste a API gratuitamente

        1. Crie sua conta grátis no [Site](https://portal.arquivo-nfe.com)
        2. Copie seu token de acesso no meu lateral "Meu Token"
        3. Volte a está página, clique no botão "Authorize" e informe:
      
           SEU_TOKEN
      
        **Observação:** Os parâmetros informados devem conter a quantidade completa de dígitos, inclusive zeros à esquerda quando aplicável. Para os parâmetros que admitirem formatação, os valores podem ser enviados com ou sem máscara. 
      
      operationId: cadesp
      parameters:
        - name: cnpj
          in: query
          required: true
          description: CNPJ do contribuinte
          schema:
            type: string
        - name: request_id
          in: query
          required: false
          description: Identificador da requisição assíncrona retornado na primeira chamada e utilizado para consultar o resultado posteriormente
          schema:
            type: integer
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Retorno da consulta CADESP
          content:
            application/json:
              examples:
                processamento:
                  summary: Consulta em processamento
                  value:
                    info: "Aguardando retorno da SEFAZ. Consulte novamente em instantes."
                    request_id: 67890
                sucesso:
                  summary: Consulta concluída
                  value:
                    info: "Sucesso"
                    data:
                      razao_nome: "XXXXXXXXXXXXXXXXX"
                      fantasia: "XXXXXXXXXXXXXXXXX"
                      cnpj: "99.999.999/9999-99"
                      ie: "9999999999"
                      sit_cadastral: "Ativo"
                      natur_juridica: "Sociedade Empresária Limitada"
                      cnae_princ: "Comércio a varejo de...."
                      logradouro: "RUA XXXXXXXXXXX" 
        '400':
          description: Requisição inválida
        '401':
          description: Não autorizado
        '500':
          description: Erro interno


  /fgts_regularidade:
    post:
      tags:
        - FGTS - Regularidade do Empregador
      summary: API Regularidade do Empregador
      description: |
        Permite verificar se uma organização está adimplente com suas obrigações junto ao Fundo de Garantia do Tempo de Serviço (FGTS). 
        A regularidade perante o FGTS é requisito essencial para que empresas possam manter relacionamento com órgãos da administração pública 
        e instituições financeiras oficiais.

        O serviço retorna informações sobre a situação de conformidade da empresa, incluindo dados cadastrais, períodos de validade da regularidade 
        e histórico de certificações. Ao verificar a regularidade, a API também fornece acesso ao Certificado de Regularidade do FGTS (CRF), documento 
        que atesta a conformidade legal da organização.

        Fluxo:
        - Sem o envio do parâmetro request_id: inicia o processamento
        - Com o envio do parâmetro request_id: retorna o resultado da consulta

        Teste a API gratuitamente

        1. Crie sua conta grátis no [Site](https://portal.arquivo-nfe.com)
        2. Copie seu token de acesso no meu lateral "Meu Token"
        3. Volte a está página, clique no botão "Authorize" e informe:
      
           SEU_TOKEN
      
        **Observação:** Os parâmetros informados devem conter a quantidade completa de dígitos, inclusive zeros à esquerda quando aplicável. Para os parâmetros que admitirem formatação, os valores podem ser enviados com ou sem máscara. 
      
      operationId: fgts_regularidade
      parameters:
        - name: cnpj
          in: query
          required: true
          description: CNPJ da organização
          schema:
            type: string
        - name: uf
          in: query
          required: true
          description: UF do estabelecimento
          schema:
            type: string
            example: "SP"    
        - name: gera_crf
          in: query
          required: false
          description: Define se o PDF do Certificado de regularidade do FGTS (CRF) será gerado. 0 = não, 1 = sim
          schema:
            type: integer
            enum: [0, 1]
            example: 0
        - name: pdf_base64
          in: query
          required: false
          description: Define o formato de retorno do PDF do CRF quando gera_pdf = 1. (0 Retorna uma URL para download do PDF do CRF e 1 Retorna o conteúdo do PDF codificado em Base64).
          schema:
            type: integer
            enum: [0, 1]
            example: 0   
        - name: cons_hist
          in: query
          required: false
          description: Consulta o Histórico do Empregador? 0 = não, 1 = sim. Apresenta os registros dos CRF concedidos nos últimos 24 meses, conforme Manual de Orientações Regularidade do Empregador.
          schema:
            type: integer
            enum: [0, 1]
            example: 0        
        - name: request_id
          in: query
          required: false
          description: Identificador da requisição assíncrona retornado na primeira chamada e utilizado para consultar o resultado posteriormente
          schema:
            type: integer
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Retorno da consulta do FGTS Regularidade do Empregador
          content:
            application/json:
              examples:
                processamento:
                  summary: Consulta em processamento
                  value:
                    info: "Em processamento. Consulte novamente em instantes."
                    request_id: 67890
                sucesso:
                  summary: Consulta concluída
                  value:
                    info: "Sucesso"
                    data:
                      razao_nome: "XXXXXXXXXXXXXXXXX"
                      situacao_fgts: "REGULAR"
                      cnpj: "99.999.999/9999-99"
                      uf: "SP"
                      dt_resultado: "DD/MM/YYYY HH24:MI"
                      numero_crf: "9999999999999999999999"
                      dt_validade_ini: "DD/MM/YYYY"
                      dt_validade_fim: "DD/MM/YYYY"
                      dt_obtencao: "DD/MM/YYYY HH24:MI"
                      pdf: "https://g120c7c9d7b60c3..."
                      request_id: 9
        '400':
          description: Requisição inválida
        '401':
          description: Não autorizado
        '500':
          description: Erro interno  

  /pgfn_devedores:
    post:
      tags:
        - Devedores da União (PGFN)
      summary: API Devedores da União (PGFN)
      description: |
        Consulta débitos inscritos na Dívida Ativa da União (PGFN) para pessoas físicas e jurídicas. A consulta retorna detalhes completos sobre as inscrições 
        — natureza das dívidas, valores devidos, situação e data de inscrição — facilitando análise de risco de crédito, onboarding de clientes e fornecedores, 
        validações de conformidade fiscal e prevenção de fraudes.

        Os dados vêm da lista trimestral oficial de devedores publicada pela PGFN, cobrindo dívida geral/SIDA, previdenciária e FGTS.
                
        Fluxo:
        - Sem o envio do parâmetro request_id: inicia o processamento
        - Com o envio do parâmetro request_id: retorna o resultado da consulta

        É obrigatório informar pelo menos um dos parâmetros: cnpj ou cpf.

        Teste a API gratuitamente

        1. Crie sua conta grátis no [Site](https://portal.arquivo-nfe.com)
        2. Copie seu token de acesso no meu lateral "Meu Token"
        3. Volte a está página, clique no botão "Authorize" e informe:
      
           SEU_TOKEN
      
        **Observação:** Os parâmetros informados devem conter a quantidade completa de dígitos, inclusive zeros à esquerda quando aplicável. Para os parâmetros que admitirem formatação, os valores podem ser enviados com ou sem máscara. 
      
      operationId: pgfn_devedores
      parameters:
        - name: cnpj
          in: query
          required: false
          description: CNPJ
          schema:
            type: string
        - name: cpf
          in: query
          required: false
          description: CPF
          schema:
            type: string    
        - name: request_id
          in: query
          required: false
          description: Identificador da requisição assíncrona retornado na primeira chamada e utilizado para consultar o resultado posteriormente
